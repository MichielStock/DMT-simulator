# Behaviour beat phrasings (BUILD.md §11.7). Short notes for the director and the report writer.
approach:
  - "drifts closer out of the geometry"
  - "comes forward slowly, growing brighter"
  - "glides in from the edge of the world"
  - "arrives as if it had been waiting"
greet:
  - "tilts towards the viewer in a kind of welcome"
  - "opens its arms of light in greeting"
  - "bows, delighted"
  - "acknowledges the viewer with a ripple of colour"
present_object:
  - "holds out a turning geometric object"
  - "offers a small glowing shape that keeps changing"
  - "presents a jewelled object with too many sides"
  - "unfolds an intricate shape between itself and the viewer"
show:
  - "shows a pattern that seems to explain something"
  - "opens a window onto more of the world"
  - "demonstrates how the shapes fit together"
  - "draws a sequence of glowing forms in the air"
work_on:
  - "busies itself around the viewer, adjusting something unseen"
  - "works carefully, as if tuning an instrument"
  - "is absorbed in some task at the edge of attention"
  - "rearranges small lights near the viewer with great focus"
transform:
  - "changes shape, folding into a new form"
  - "becomes geometry, then becomes itself again"
  - "splits into echoes that recombine"
  - "turns inside out into a pattern and back"
depart:
  - "recedes into the world, fading"
  - "waves and dissolves into points of light"
  - "turns away and folds back into the architecture"
  - "drifts off, still glowing"
