      - "an observatory-like void where constellations rearrange into patterns, {colours}, {style}"
      - "the inside of a radiant star cloud, layered veils of light, {colours}, {style}"
    descriptions:
      - "Open space, but full, with rings of light and slow turning worlds."
      - "A sky with no ground, stars arranged like a pattern."
      - "A vast dark full of drifting glass moons."
  carnival:
    prompts:
      - "a radiant carnival of spinning pavilions, striped tents and glowing lanterns, {colours}, {style}"
      - "a circus ring under an enormous canopy of light, everything turning and bright, {colours}, {style}"
      - "a funfair of impossible rides made of jewelled geometry, {colours}, {style}"
      - "a playful festival space with ribbons, banners without writing, and turning wheels of light, {colours}, {style}"
      - "a hall of mirrors and carousels that loop through each other, {colours}, {style}"
      - "a big top whose canvas opens onto more big tops, lit in {colours}, {style}"
