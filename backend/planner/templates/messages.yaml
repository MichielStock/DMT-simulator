# Sealed messages (BUILD.md §4.3): abstract and non-directive. Never imperative, never advice,
# never predictions, never real people. Themes: attention, play, care, curiosity, wonder.
attention:
  - "Everything was already listening."
  - "Attention is a kind of light, and it was on the whole time."
  - "Being seen and seeing turned out to be the same motion."
  - "Each small thing was being noticed, all at once."
  - "The looking itself was the warm part."
  - "Here, quiet was a way of paying attention."
  - "Nothing was too small to be held in view."
play:
  - "It was all a game, and the game was glad of company."
  - "The shapes were laughing, and the laugh included me."
  - "Seriousness was optional; delight was the floor."
  - "Every rule here could be folded into a new toy."
  - "The joke went on forever, and it was a kind one."
  - "Play was what everything was made of."
  - "Even the stillness had a grin in it."
care:
  - "There was room enough for everyone."
  - "Being held was the ordinary state of things."
  - "Kindness was built into the walls."
  - "Nothing here was alone for very long."
  - "Gentleness went all the way down."
  - "Welcome was the shape of the whole place."
  - "Somebody had kept a light on, just in case."
curiosity:
  - "Every answer opened into a better question."
  - "The not-knowing was the interesting part."
  - "Each door had another door inside it, on purpose."
  - "Wondering was a way of travelling."
  - "There was always one more fold to look into."
  - "A question can be a gift that keeps unwrapping."
  - "Puzzles here were offered like presents."
wonder:
  - "It is all much larger, and much kinder, than it looks."
  - "Ordinary things were secretly enormous."
  - "There was more here than there was room for, and it fit."
  - "Even the edges were shining."
  - "The whole thing was astonished at itself."
  - "Every surface was a window onto more."
  - "Simply existing felt like a surprise party."
