# Stage-one priors for the trip planner (BUILD.md §9.1). Every number carries its source.
# Sources: Lawrence et al. 2022 (Sci Rep 12; inhaled DMT report content), Davis et al. 2020
# (J Psychopharmacol; entity-encounter survey), Michael, Luke & Robinson 2021 (Front Psychol 12:720717),
# Haijen et al. 2018 / Russ et al. 2019 (set and setting structure), BUILD.md §7 (pharmacology), design.

version: 1

pharmacology:
  dose_steps:            # model units relative to the half-effect level (BUILD.md §7.2); never real amounts
    threshold: 0.4
    light: 1.0
    strong: 2.0
    breakthrough: 4.0
  sensitivity_sigma: 0.25   # LogNormal(0, 0.25), BUILD.md §7.2
  clearance_sigma: 0.20     # LogNormal(0, 0.2), BUILD.md §7.2
  params: {ka: 4.0, k10: 0.12, k12: 0.20, k21: 0.03, ke0: [2.5, 1.2, 0.6], h: 2.0}   # BUILD.md §7.2

palettes:                # design: jewel-toned, saturated, no pure white; probabilities uniform (design)
  jewel:  ["#1b0a3c", "#5b1a8f", "#c2187a", "#e8a33b", "#1f8f7a", "#3a5bd9"]
  neon:   ["#0d0221", "#ff2a6d", "#05d9e8", "#d1f7ff", "#7b2ff7", "#f9c80e"]
  ember:  ["#1a0505", "#7a1f0f", "#d9480f", "#f59f00", "#ffd43b", "#9c36b5"]
  lunar:  ["#060b1f", "#1c2c5b", "#4361ee", "#7fd1ff", "#c8b6ff", "#e9d8a6"]
  verdant: ["#03140c", "#0b5d3b", "#2fbf71", "#c3f73a", "#f0a202", "#6a4c93"]
palette_weights: {jewel: 0.2, neon: 0.2, ember: 0.2, lunar: 0.2, verdant: 0.2}   # design

form_constants:          # Klüver form constants via Ermentrout–Cowan / Bressloff (BUILD.md §11.4); design weights
  modes: {stripes: 0.4, hexagons: 0.3, mixed: 0.3}   # spirals come from spiral_bias (schema enum)
  wavelength: [0.6, 1.3]          # uniform, relative units (design)
  spiral_bias: [0.0, 0.7]         # uniform (design)

chrysanthemum:           # hyperbolic triangle groups (p,q,r) with 1/p+1/q+1/r < 1 (BUILD.md §11.5); design
  groups: [[2, 3, 7], [2, 4, 5], [2, 3, 9], [3, 3, 4], [2, 5, 5], [4, 4, 4]]
  n_groups: 3
  kleinian_trace_real: [1.9, 2.3]   # Riley/Maskit-style traces near the parabolic value 2 (Indra's Pearls); design
  kleinian_trace_imag: [0.0, 0.25]

waiting_room:            # BUILD.md §11.6: kaleidoscopic IFS or Mandelbox; design
  kinds: {kifs: 0.6, mandelbox: 0.4}   # kifs = kaleidoscopic IFS (schema enum names)

encounter:               # P(beings | deepest layer); Michael, Luke & Robinson 2021 (94% of breakthrough reports)
  by_deepest_layer:
    none: 0.0
    onset: 0.0
    form_constants: 0.0
    chrysanthemum: 0.05
    waiting_room: 0.40
    breakthrough: 0.94
  contingency_p: 0.94    # used for breakthrough assets when a repeat hit could reach breakthrough (design, = breakthrough rate)

entity_types:            # Lawrence et al. 2022, share of encounters (sums to 100); sub-types per BUILD.md §9.1
  luminous_feminine: 24.2
  deity: 17.0
  alien: 16.3
  creature_reptilian: 3.0     # creature total 9.2
  creature_tentacled: 2.4
  creature_insectoid: 2.3
  creature_feline: 1.5
  machine_elf: 2.9            # mythological total 8.4
  mythological: 5.5           # elves, sprites and others (8.4 - 2.9)
  jester: 6.5
  living_geometry: 18.4       # living geometry / unspecified
expectation_multiplier: 1.5   # BUILD.md §8.2: each matching expectation multiplies the weight by 1.5

labels:                  # Davis et al. 2020, non-exclusive; if none is drawn the label defaults to "being"
  being: 0.60
  guide: 0.43
  spirit: 0.39
  alien: 0.39
  helper: 0.34

attributes:              # Davis et al. 2020
  conscious: 0.96
  intelligent: 0.96
  benevolent: 0.78
  sacred: 0.70
  agency: 0.54

disposition:             # design per BUILD.md §9.1 item 7 (benevolent is the default when benevolent; stern only in difficult passages)
  if_benevolent: {benevolent: 0.70, playful: 0.30}
  if_not_benevolent: {playful: 0.35, indifferent: 0.65}
  playful_types: [jester, machine_elf, mythological]   # these swap benevolent→playful with p 0.6 (design)
  playful_swap_p: 0.6

communication:           # Davis et al. 2020: entity→user 0.49, two-way 0.40, user→entity 0.02, none/unclear remainder
  entity_to_user: 0.49
  two_way: 0.40
  user_to_entity: 0.02
  none: 0.09

message:                 # Davis et al. 2020: 69% received a message; scaled with intention clarity (design)
  p: 0.69
  clarity_slope: 0.20     # p = clip(0.69 + 0.20 * (clarity - 5) / 5, 0.05, 0.95)
  p_min: 0.05
  p_max: 0.95

entity_count:            # BUILD.md §9.1 item 10 (design from report shares)
  one: 0.70
  few: 0.25               # 2 or 3, equally likely
  many: 0.05              # 4 rendered (asset budget is 4 entities, BUILD.md §10)
  many_count: 4

world_categories:        # design vocabulary, BUILD.md §9.1 item 11; base weights uniform
  geometric_chamber: 1.0
  dome_temple: 1.0
  infinite_hall: 1.0
  workshop: 1.0
  organic_jungle: 1.0
  cosmic_space: 1.0
  carnival: 1.0
world_affinity:          # design: multiply a category weight when the first entity has this type
  jester: {carnival: 3.0}
  machine_elf: {workshop: 3.0, geometric_chamber: 1.5}
  alien: {cosmic_space: 2.0, workshop: 1.5}
  deity: {dome_temple: 2.0, cosmic_space: 1.5}
  luminous_feminine: {dome_temple: 1.5, organic_jungle: 1.5}
  creature_reptilian: {organic_jungle: 2.0}
  creature_tentacled: {cosmic_space: 1.5, organic_jungle: 1.5}
  creature_insectoid: {workshop: 1.5, infinite_hall: 1.5}
  creature_feline: {organic_jungle: 2.0}
  living_geometry: {geometric_chamber: 2.0, infinite_hall: 1.5}

behaviours:              # design; beat sequence always starts with approach and ends with depart
  optional_p:
    greet: 0.75
    present_object: 0.40
    show: 0.50
    work_on: 0.35
    transform: 0.50
  work_on_if_indifferent: 0.75
  arrival_delay_s: [5, 20]          # BUILD.md §11.7: entities arrive 5–20 s after the latch
  beat_duration_s:                  # rough timing per beat (design)
    approach: [4, 8]
    greet: [3, 6]
    present_object: [6, 12]
    show: [6, 14]
    work_on: [8, 16]
    transform: [5, 10]
    depart: [5, 9]

challenge:               # BUILD.md §9.1 item 12 (Haijen 2018, Russ 2019 structure)
  intercept: -2.2
  peak_coef: 0.35        # per point of predicted peak above 5
  set_coef: -0.25
  surrender_coef: -0.15  # per point of surrender above 5
  recreation_coef: -0.5
  onset_after_peak_s: [10, 60]   # design: onset_offset_s = seconds after the predicted peak (schema), uniform 10–60
  flavours: {pressure: 0.4, dissolution: 0.35, pursuit: 0.25}   # design

report:
  length_median_words: 311  # Lawrence et al. 2022: median 311, IQR 160–568
  length_sigma: 0.94        # LogNormal(ln 311, 0.94)
  length_min: 120
  length_max: 900
  profundity_overall: 0.061       # Lawrence et al. 2022: 6.1% of reports
  profundity_weight_breakthrough: 2.5   # design: weighted towards breakthrough sessions
  profundity_weight_other: 0.5
  dose_mix: {threshold: 0.10, light: 0.20, strong: 0.35, breakthrough: 0.35}   # BUILD.md §14 assumption
  breakthrough_share_by_dose: {threshold: 0.0, light: 0.0, strong: 0.04, breakthrough: 0.75}   # BUILD.md §7.3 population table

contingency:
  breakthrough_asset_steps: [strong, breakthrough]   # BUILD.md §7.5
