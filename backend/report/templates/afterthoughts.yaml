# Arc beat: afterthoughts.
mandatory:
  - lines:
      - "Afterwards, mostly I felt curious."
      - "Looking back, it's hard to separate what I saw from what I'm reconstructing."
      - "I'm writing this not long after, and it's already slipping."
      - "Mostly I came away amused and a bit stunned."
optional:
  - lines:
      - "My drawn curve afterwards was way off from the real one, which says a lot."
      - "It's strange how little of the middle stayed with me."
      - "I keep wanting to call it beautiful, which isn't wrong, but isn't enough."
      - "I don't know what it means, if anything, and I'm fine with that."
      - "Now that it's done I'm surprised how calm I feel."
      - "I'd describe it differently every time I tried, I think."
      - "It was a simulation, I know, and some part of me knew it the whole time."
      - "I keep thinking about how ordered everything was, and how fast."
      - "The timeline afterwards showed the peak lasted a lot less long than it felt."
      - "Part of it was definitely just a lot of light, and part of it felt like more than that."
      - "I'm glad I tried it, honestly."
      - "It's the kind of thing I'll probably re-read and not recognise."
profundity:
  - "It was honestly one of the most profound things I've been through, simulated or not."
  - "I know how that reads, but it felt profound, like it touched something that matters."
  - "It ranks as one of the most meaningful experiences I've had, which I did not expect from a simulation."
fillers:
  - "Some of what I've written is probably reconstruction rather than memory."
  - "I'm aware my memory has stitched the pieces together in a neater order than they happened."
  - "There are holes in this, and I've filled some of them with guesses."
  - "I keep remembering little fragments at odd moments, then losing them again."
  - "It's hard to say how much of the order here is real."
  - "I may be mixing up which part came first."
  - "Most of the details have already gone soft around the edges."
  - "If I tried again to write this next week it would probably come out different."
