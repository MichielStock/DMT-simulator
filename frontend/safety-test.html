<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Hyperspace — SafetyLimiter test patterns</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #c { display: block; width: 100vw; height: 100vh; }
    /* Tiny frame tick in the corner: keeps screencast capture delivering frames even when the
       limited output is static. Far below any area threshold. */
    #tick { position: fixed; right: 2px; bottom: 2px; font: 9px monospace; color: #555; }
  </style>
</head>
<body>
  <canvas id="c" data-testid="trip-canvas"></canvas>
  <div id="tick">0</div>
  <script type="module" src="/src/safetyTestMain.ts"></script>
</body>
</html>
